<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&amp;display=swap');
      text { font-family: 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="420" fill="white"/>

  <!-- ===== PANEL 1: PHREEQC ===== -->
  <rect x="30" y="40" width="300" height="340" rx="12" fill="#DBEAFE" stroke="#2166AC" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Panel 1 header bar -->
  <rect x="30" y="40" width="300" height="50" rx="12" fill="#2166AC"/>
  <rect x="30" y="70" width="300" height="20" fill="#2166AC"/>
  <text x="180" y="72" text-anchor="middle" fill="white" font-size="17" font-weight="700">Geochemical Simulation</text>

  <!-- PHREEQC subtitle -->
  <text x="180" y="115" text-anchor="middle" fill="#2166AC" font-size="14" font-weight="600">PHREEQC 3.5.0 + minteq.v4.dat</text>

  <!-- Parameter grid icon -->
  <rect x="65" y="135" width="28" height="28" rx="3" fill="#2166AC" opacity="0.15" stroke="#2166AC" stroke-width="1"/>
  <rect x="97" y="135" width="28" height="28" rx="3" fill="#2166AC" opacity="0.25" stroke="#2166AC" stroke-width="1"/>
  <rect x="129" y="135" width="28" height="28" rx="3" fill="#2166AC" opacity="0.35" stroke="#2166AC" stroke-width="1"/>
  <rect x="161" y="135" width="28" height="28" rx="3" fill="#2166AC" opacity="0.45" stroke="#2166AC" stroke-width="1"/>
  <rect x="193" y="135" width="28" height="28" rx="3" fill="#2166AC" opacity="0.55" stroke="#2166AC" stroke-width="1"/>
  <rect x="225" y="135" width="28" height="28" rx="3" fill="#2166AC" opacity="0.65" stroke="#2166AC" stroke-width="1"/>
  <rect x="257" y="135" width="28" height="28" rx="3" fill="#2166AC" opacity="0.80" stroke="#2166AC" stroke-width="1"/>
  
  <rect x="65" y="167" width="28" height="28" rx="3" fill="#2166AC" opacity="0.20" stroke="#2166AC" stroke-width="1"/>
  <rect x="97" y="167" width="28" height="28" rx="3" fill="#2166AC" opacity="0.30" stroke="#2166AC" stroke-width="1"/>
  <rect x="129" y="167" width="28" height="28" rx="3" fill="#2166AC" opacity="0.40" stroke="#2166AC" stroke-width="1"/>
  <rect x="161" y="167" width="28" height="28" rx="3" fill="#2166AC" opacity="0.50" stroke="#2166AC" stroke-width="1"/>
  <rect x="193" y="167" width="28" height="28" rx="3" fill="#2166AC" opacity="0.60" stroke="#2166AC" stroke-width="1"/>
  <rect x="225" y="167" width="28" height="28" rx="3" fill="#2166AC" opacity="0.70" stroke="#2166AC" stroke-width="1"/>
  <rect x="257" y="167" width="28" height="28" rx="3" fill="#2166AC" opacity="0.90" stroke="#2166AC" stroke-width="1"/>

  <!-- Parameter list -->
  <text x="180" y="222" text-anchor="middle" fill="#333" font-size="12" font-weight="600">Parameters Varied:</text>
  <text x="180" y="242" text-anchor="middle" fill="#555" font-size="11">pH (5.5–7.5)  •  4 Metals (Pb, Cu, Zn, Cd)</text>
  <text x="180" y="259" text-anchor="middle" fill="#555" font-size="11">5 Chelators  •  3 Dose Levels</text>
  <text x="180" y="276" text-anchor="middle" fill="#555" font-size="11">3 Textures  •  3 Ionic Strength Levels</text>
  <text x="180" y="293" text-anchor="middle" fill="#555" font-size="11">3 Moisture/Redox  •  2 Ca/Mg Levels</text>

  <!-- Bottom badge -->
  <rect x="95" y="315" width="170" height="36" rx="18" fill="#2166AC"/>
  <text x="180" y="338" text-anchor="middle" fill="white" font-size="14" font-weight="700">12,636 Scenarios</text>


  <!-- ===== ARROW 1 ===== -->
  <line x1="340" y1="210" x2="395" y2="210" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="367" y="185" text-anchor="middle" fill="#777" font-size="10" font-weight="600">Training Data</text>
  <text x="367" y="198" text-anchor="middle" fill="#777" font-size="9">(CSV)</text>


  <!-- ===== PANEL 2: ML ===== -->
  <rect x="405" y="40" width="300" height="340" rx="12" fill="#FEE2E2" stroke="#B2182B" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Panel 2 header bar -->
  <rect x="405" y="40" width="300" height="50" rx="12" fill="#B2182B"/>
  <rect x="405" y="70" width="300" height="20" fill="#B2182B"/>
  <text x="555" y="72" text-anchor="middle" fill="white" font-size="17" font-weight="700">Machine Learning</text>

  <!-- ML subtitle -->
  <text x="555" y="115" text-anchor="middle" fill="#B2182B" font-size="14" font-weight="600">Gradient Boosting Regression</text>

  <!-- Decision tree icon (simplified) -->
  <!-- Root -->
  <circle cx="555" cy="145" r="10" fill="#B2182B" opacity="0.7"/>
  <!-- Level 1 -->
  <line x1="555" y1="155" x2="515" y2="170" stroke="#B2182B" stroke-width="1.5" opacity="0.5"/>
  <line x1="555" y1="155" x2="595" y2="170" stroke="#B2182B" stroke-width="1.5" opacity="0.5"/>
  <circle cx="515" cy="175" r="7" fill="#B2182B" opacity="0.5"/>
  <circle cx="595" cy="175" r="7" fill="#B2182B" opacity="0.5"/>
  <!-- Level 2 -->
  <line x1="515" y1="182" x2="495" y2="195" stroke="#B2182B" stroke-width="1" opacity="0.35"/>
  <line x1="515" y1="182" x2="535" y2="195" stroke="#B2182B" stroke-width="1" opacity="0.35"/>
  <line x1="595" y1="182" x2="575" y2="195" stroke="#B2182B" stroke-width="1" opacity="0.35"/>
  <line x1="595" y1="182" x2="615" y2="195" stroke="#B2182B" stroke-width="1" opacity="0.35"/>
  <circle cx="495" cy="199" r="5" fill="#B2182B" opacity="0.3"/>
  <circle cx="535" cy="199" r="5" fill="#B2182B" opacity="0.3"/>
  <circle cx="575" cy="199" r="5" fill="#B2182B" opacity="0.3"/>
  <circle cx="615" cy="199" r="5" fill="#B2182B" opacity="0.3"/>

  <!-- Model details -->
  <text x="555" y="232" text-anchor="middle" fill="#333" font-size="12" font-weight="600">4 Independent Models:</text>
  
  <!-- Metal model boxes -->
  <rect x="425" y="242" width="55" height="24" rx="4" fill="#2166AC"/>
  <text x="452" y="258" text-anchor="middle" fill="white" font-size="11" font-weight="600">Pb</text>
  
  <rect x="487" y="242" width="55" height="24" rx="4" fill="#B2182B"/>
  <text x="514" y="258" text-anchor="middle" fill="white" font-size="11" font-weight="600">Cu</text>
  
  <rect x="549" y="242" width="55" height="24" rx="4" fill="#4DAF4A"/>
  <text x="576" y="258" text-anchor="middle" fill="white" font-size="11" font-weight="600">Zn</text>
  
  <rect x="611" y="242" width="55" height="24" rx="4" fill="#FF7F00"/>
  <text x="638" y="258" text-anchor="middle" fill="white" font-size="11" font-weight="600">Cd</text>

  <text x="555" y="290" text-anchor="middle" fill="#555" font-size="11">14 Input Features → % Free Metal</text>
  <text x="555" y="307" text-anchor="middle" fill="#555" font-size="11">5-Fold Cross-Validation</text>

  <!-- Bottom badge -->
  <rect x="460" y="315" width="190" height="36" rx="18" fill="#B2182B"/>
  <text x="555" y="338" text-anchor="middle" fill="white" font-size="13" font-weight="700">R² = 0.95–1.00 (CV)</text>


  <!-- ===== ARROW 2 ===== -->
  <line x1="715" y1="210" x2="770" y2="210" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="742" y="185" text-anchor="middle" fill="#777" font-size="10" font-weight="600">Trained Models</text>
  <text x="742" y="198" text-anchor="middle" fill="#777" font-size="9">(.joblib)</text>


  <!-- ===== PANEL 3: Interface ===== -->
  <rect x="780" y="40" width="290" height="340" rx="12" fill="#DCFCE7" stroke="#4DAF4A" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Panel 3 header bar -->
  <rect x="780" y="40" width="290" height="50" rx="12" fill="#4DAF4A"/>
  <rect x="780" y="70" width="290" height="20" fill="#4DAF4A"/>
  <text x="925" y="72" text-anchor="middle" fill="white" font-size="17" font-weight="700">Decision Support Tool</text>

  <!-- Interface subtitle -->
  <text x="925" y="115" text-anchor="middle" fill="#388E3C" font-size="14" font-weight="600">Streamlit Web Interface</text>

  <!-- Simplified interface mockup -->
  <rect x="820" y="130" width="210" height="140" rx="6" fill="white" stroke="#ccc" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect x="820" y="130" width="210" height="22" rx="6" fill="#eee"/>
  <circle cx="834" cy="141" r="4" fill="#FF5F56"/>
  <circle cx="848" cy="141" r="4" fill="#FFBD2E"/>
  <circle cx="862" cy="141" r="4" fill="#27C93F"/>
  <!-- Input fields -->
  <rect x="832" y="160" width="80" height="12" rx="2" fill="#f0f0f0" stroke="#ddd" stroke-width="0.5"/>
  <text x="838" y="169" fill="#999" font-size="7">pH: 6.2</text>
  <rect x="920" y="160" width="98" height="12" rx="2" fill="#f0f0f0" stroke="#ddd" stroke-width="0.5"/>
  <text x="926" y="169" fill="#999" font-size="7">Texture: Sandy Loam</text>
  <rect x="832" y="178" width="80" height="12" rx="2" fill="#f0f0f0" stroke="#ddd" stroke-width="0.5"/>
  <text x="838" y="187" fill="#999" font-size="7">Pb: 150 mg/kg</text>
  <rect x="920" y="178" width="98" height="12" rx="2" fill="#f0f0f0" stroke="#ddd" stroke-width="0.5"/>
  <text x="926" y="187" fill="#999" font-size="7">Moisture: Mesic</text>
  <!-- Result area -->
  <rect x="832" y="200" width="186" height="28" rx="3" fill="#E8F5E9"/>
  <text x="925" y="213" text-anchor="middle" fill="#2E7D32" font-size="8" font-weight="700">RECOMMENDATION: Citrate 300 mg/L</text>
  <text x="925" y="223" text-anchor="middle" fill="#555" font-size="7">Predicted Pb free: 12.3% | Effectiveness: Excellent</text>
  <!-- Bar chart hint -->
  <rect x="835" y="234" width="15" height="28" fill="#2166AC" opacity="0.6"/>
  <rect x="855" y="244" width="15" height="18" fill="#B2182B" opacity="0.6"/>
  <rect x="875" y="237" width="15" height="25" fill="#4DAF4A" opacity="0.6"/>
  <rect x="895" y="240" width="15" height="22" fill="#FF7F00" opacity="0.6"/>

  <!-- Details -->
  <text x="925" y="295" text-anchor="middle" fill="#333" font-size="12" font-weight="600">Practitioner Inputs:</text>
  <text x="925" y="313" text-anchor="middle" fill="#555" font-size="11">Site pH, metals, texture, moisture</text>
  <text x="925" y="330" text-anchor="middle" fill="#555" font-size="11">→ Instant chelator recommendation</text>

  <!-- Bottom badge -->
  <rect x="815" y="345" width="220" height="28" rx="14" fill="#4DAF4A"/>
  <text x="925" y="364" text-anchor="middle" fill="white" font-size="12" font-weight="700">No Modeling Expertise Required</text>

  <!-- ===== BOTTOM BANNER ===== -->
  <text x="550" y="408" text-anchor="middle" fill="#666" font-size="12" font-weight="600" font-style="italic">
    Fig. 1. Three-stage pipeline: geochemical simulation → machine learning → decision support interface.
  </text>

</svg>
